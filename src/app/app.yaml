# Databricks App Configuration
# Node.js (Vite + Express) — dist/ pre-built locally; runtime just runs the Express server
command:
  - "sh"
  - "-c"
  - |
    npm install --omit=dev && node app.js

env:
  - name: NODE_ENV
    value: production
  - name: DATABRICKS_HTTP_PATH
    value: /sql/1.0/warehouses/2dfc76f4d7c64141
  - name: STORE_INTEL_CATALOG
    value: hatim_apps_showcase_catalog
  - name: STORE_INTEL_SCHEMA
    value: store_intelligence
  - name: PGHOST
    value: ep-cold-paper-d22w6scd.database.us-east-1.cloud.databricks.com
  - name: PGPORT
    value: "5432"
  - name: PGDATABASE
    value: demo_platform
  - name: PGUSER
    value: bc26e078-c351-4118-b087-02b055a78a28
  - name: DATABRICKS_HOST
    value: https://fevm-hatim-apps-showcase.cloud.databricks.com
